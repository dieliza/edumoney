name: EduMoney - Verificación de cierre
on:
  push:
    branches: [cierre-edumoney]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.maestro/**'
      - 'scripts/**'
      - 'app.json'
      - 'package*.json'
      - '.github/workflows/closure-validation.yml'
      - '.github/workflows/planilla-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  mobile:
    if: ${{ !contains(github.event.head_commit.message, '[partial-ios-only]') }}
    uses: ./.github/workflows/planilla-validation.yml
    with:
      platform: both
      scenario: business-planning-complete
      artifact_suffix: business-planning-complete
  export-android:
    if: ${{ !contains(github.event.head_commit.message, '[partial-ios-only]') }}
    uses: ./.github/workflows/planilla-validation.yml
    with:
      platform: android
      scenario: business-review-export
      artifact_suffix: business-review-export
  partial-ios:
    uses: ./.github/workflows/planilla-validation.yml
    with:
      platform: ios
      scenario: business-planning-partial
      artifact_suffix: business-planning-partial
