name: Etapa 2 - Diseño y navegación
on:
  push:
    branches: [etapa-2-diseno]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plataforma a verificar'
        type: choice
        options: [both, android, ios]
        default: both
      artifact_run:
        description: 'Opcional: repetir pruebas con los paquetes de una ejecución anterior, sin recompilar'
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: visual-${{ github.ref }}-${{ github.event_name }}-${{ inputs.platform }}
  cancel-in-progress: true
jobs:
  android:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MAESTRO_CLI_NO_ANALYTICS: 1
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 300000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - run: npm run lint && npm run check
      - run: npx expo prebuild --no-install
        env:
          CI: 1
      - run: node scripts/verify-native.mjs
      - name: Recuperar APK compilado
        if: inputs.artifact_run != ''
        uses: actions/download-artifact@v4
        with:
          name: android-etapa-2
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ github.token }}
      - name: Compilar APK de prueba con JavaScript incluido
        if: inputs.artifact_run == ''
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Instalar Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Arranque y reapertura sin conexión
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            adb shell svc wifi disable
            adb shell svc data disable
            maestro test --test-output-dir native-results .maestro/visual.yaml
            adb shell cmd uimode night yes
            maestro test --test-output-dir native-results/automatic-dark .maestro/automatic-dark.yaml
            adb shell cmd uimode night no
            maestro test --test-output-dir native-results/automatic-light .maestro/automatic-light.yaml
            adb shell settings put system font_scale 1.3
            adb shell am force-stop com.edumoney.app
            adb shell monkey -p com.edumoney.app 1
            sleep 4
            adb shell screencap -p /sdcard/large-font.png
            adb pull /sdcard/large-font.png native-results/large-font.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-etapa-2
          path: |
            android/app/build/outputs/apk/release/*.apk
            native-results/
          retention-days: 7
  ios:
    if: inputs.platform != 'android'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      MAESTRO_CLI_NO_ANALYTICS: 1
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 300000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --no-install
        env:
          CI: 1
      - run: node scripts/verify-native.mjs
      - name: Recuperar aplicación de simulador compilada
        if: inputs.artifact_run != ''
        uses: actions/download-artifact@v4
        with:
          name: ios-etapa-2
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ github.token }}
      - name: Instalar CocoaPods
        if: inputs.artifact_run == ''
        working-directory: ios
        run: pod install
      - name: Compilar para simulador con firma local de Xcode
        if: inputs.artifact_run == ''
        run: |
          set -o pipefail
          cp scripts/simulator.entitlements ios/EduMoney/EduMoney.entitlements
          xcodebuild -workspace ios/EduMoney.xcworkspace -scheme EduMoney -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build | tee ios-build.log
      - name: Instalar Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Iniciar simulador y ejecutar prueba
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for devices in d["devices"].values() for v in devices if "iPhone" in v["name"]))')
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          chmod -R +x build/Build/Products/Release-iphonesimulator/EduMoney.app
          codesign --verify --strict --verbose=2 build/Build/Products/Release-iphonesimulator/EduMoney.app
          xcrun simctl install "$DEVICE_ID" build/Build/Products/Release-iphonesimulator/EduMoney.app
          rm -rf native-results
          bash scripts/ios-smoke.sh "$DEVICE_ID"
          xcrun simctl ui "$DEVICE_ID" appearance dark
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot native-results/ios-direct/automatic-dark.png
          xcrun simctl ui "$DEVICE_ID" appearance light
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot native-results/ios-direct/automatic-light.png
          maestro --device "$DEVICE_ID" test --test-output-dir native-results/visual .maestro/visual.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-etapa-2
          path: |
            build/Build/Products/Release-iphonesimulator/EduMoney.app
            native-results/
            ios-build.log
          retention-days: 7
