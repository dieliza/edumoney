name: Etapa 10 - Cierre, laboratorio y respaldo
on:
  push:
    branches: [etapa-10-planilla]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plataforma a verificar'
        type: choice
        options: [both, android, ios]
        default: both
      scenario:
        description: 'Recorrido completo, entrevista o nómina móvil'
        type: choice
        options: [full, persistence, payroll, payroll-payments, payroll-policy-export, payroll-export]
        default: full
      artifact_run:
        description: 'Opcional: repetir pruebas con los paquetes de una ejecución anterior, sin recompilar'
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: planilla-${{ github.ref }}-${{ github.event_name }}-${{ inputs.platform }}
  cancel-in-progress: true
jobs:
  android:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_PLANILLA_TESTS: 1
      MAESTRO_CLI_NO_ANALYTICS: 1
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 300000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - run: npm run lint && npm run typecheck
      - run: npm test
        if: inputs.scenario != 'payroll' && inputs.scenario != 'payroll-payments' && inputs.scenario != 'payroll-policy-export' && inputs.scenario != 'payroll-export'
      - run: npx expo prebuild --no-install
        env:
          CI: 1
      - run: node scripts/verify-native.mjs
      - uses: actions/cache/restore@v4
        id: native-cache
        if: inputs.artifact_run == ''
        with:
          path: android/app/build/outputs/apk/release/
          key: planilla-test-native-${{ runner.os }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.js', 'src/**/*.jsx', 'src/**/*.json', 'assets/**', 'modules/**', 'index.ts', 'app.json', 'package-lock.json', 'plugins/**', 'scripts/simulator.entitlements', 'scripts/prepare-local-recognition.mjs', 'package.json') }}
      - name: Recuperar APK compilado
        if: inputs.artifact_run != ''
        uses: actions/download-artifact@v4
        with:
          name: android-etapa-10
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ github.token }}
      - name: Compilar APK de prueba con JavaScript incluido
        if: inputs.artifact_run == '' && steps.native-cache.outputs.cache-hit != 'true'
        working-directory: android
        run: |
          # La descarga del wrapper puede superar los 10 segundos del valor predeterminado.
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - uses: actions/cache/save@v4
        if: inputs.artifact_run == '' && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: android/app/build/outputs/apk/release/
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Instalar Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Arranque y reapertura sin conexión
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            if [ "${{ inputs.scenario }}" = "payroll-policy-export" ] || [ "${{ inputs.scenario }}" = "payroll-export" ]; then bash scripts/install-android-share-fixture.sh; fi
            adb shell svc wifi disable
            adb shell svc data disable
            rm -rf native-results
            maestro test --test-output-dir native-results "${{ inputs.scenario == 'payroll-export' && '.maestro/business-payroll-export.yaml' || inputs.scenario == 'payroll-policy-export' && '.maestro/business-payroll-policy-export.yaml' || inputs.scenario == 'payroll-payments' && '.maestro/business-payroll-payments.yaml' || inputs.scenario == 'payroll' && '.maestro/business-payroll.yaml' || '.maestro/planilla.yaml' }}"
            adb shell dumpsys meminfo com.edumoney.app > native-results/android-memory.txt
            adb shell am force-stop com.edumoney.app
            adb shell am start -W com.edumoney.app/.MainActivity > native-results/android-startup.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-etapa-10
          path: |
            android/app/build/outputs/apk/release/*.apk
            native-results/
          retention-days: 7
  ios:
    if: inputs.platform != 'android'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_PLANILLA_TESTS: 1
      MAESTRO_CLI_NO_ANALYTICS: 1
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 600000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --no-install
        env:
          CI: 1
      - run: node scripts/verify-native.mjs
      - uses: actions/cache/restore@v4
        id: native-cache
        if: inputs.artifact_run == ''
        with:
          path: build/Build/Products/Release-iphonesimulator/EduMoney.app
          key: planilla-test-native-${{ runner.os }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.js', 'src/**/*.jsx', 'src/**/*.json', 'assets/**', 'modules/**', 'index.ts', 'app.json', 'package-lock.json', 'plugins/**', 'scripts/simulator.entitlements', 'scripts/prepare-local-recognition.mjs', 'package.json') }}
      - name: Recuperar aplicación de simulador compilada
        if: inputs.artifact_run != ''
        uses: actions/download-artifact@v4
        with:
          name: ios-etapa-10
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ github.token }}
      - name: Instalar CocoaPods
        if: inputs.artifact_run == '' && steps.native-cache.outputs.cache-hit != 'true'
        working-directory: ios
        run: pod install
      - name: Compilar para simulador con firma local de Xcode
        if: inputs.artifact_run == '' && steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          cp scripts/simulator.entitlements ios/EduMoney/EduMoney.entitlements
          xcodebuild -workspace ios/EduMoney.xcworkspace -scheme EduMoney -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES build | tee ios-build.log
      - uses: actions/cache/save@v4
        if: inputs.artifact_run == '' && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: build/Build/Products/Release-iphonesimulator/EduMoney.app
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Instalar Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Iniciar simulador y ejecutar prueba
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for devices in d["devices"].values() for v in devices if "iPhone" in v["name"]))')
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          chmod -R +x build/Build/Products/Release-iphonesimulator/EduMoney.app
          codesign --verify --strict --verbose=2 build/Build/Products/Release-iphonesimulator/EduMoney.app
          xcrun simctl install "$DEVICE_ID" build/Build/Products/Release-iphonesimulator/EduMoney.app
          rm -rf native-results
          mkdir -p native-results
          xcrun simctl ui "$DEVICE_ID" appearance light
          set -o pipefail
          TEST_FLOW=.maestro/planilla.yaml
          if [ "${{ inputs.scenario }}" = "persistence" ]; then TEST_FLOW=.maestro/planilla-persistence.yaml; fi
          if [ "${{ inputs.scenario }}" = "payroll" ]; then TEST_FLOW=.maestro/business-payroll.yaml; fi
          if [ "${{ inputs.scenario }}" = "payroll-payments" ]; then TEST_FLOW=.maestro/business-payroll-payments.yaml; fi
          if [ "${{ inputs.scenario }}" = "payroll-policy-export" ]; then TEST_FLOW=.maestro/business-payroll-policy-export.yaml; fi
          if [ "${{ inputs.scenario }}" = "payroll-export" ]; then TEST_FLOW=.maestro/business-payroll-export.yaml; fi
          maestro --device "$DEVICE_ID" test --test-output-dir native-results "$TEST_FLOW" 2>&1 | tee native-results/maestro-planilla.log
          # Revalidar el cifrado y la reapertura después de guardar los movimientos de prueba.
          bash scripts/ios-smoke.sh "$DEVICE_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-etapa-10
          path: |
            build/Build/Products/Release-iphonesimulator/EduMoney.app
            native-results/
            ios-build.log
          retention-days: 7
