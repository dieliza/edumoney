appId: com.edumoney.app
---
- runFlow:
    file: business-payroll-holder.yaml
- scrollUntilVisible:
    element: "Añadir empleado"
    direction: DOWN
    centerElement: true
- tapOn: "Añadir empleado"
- extendedWaitUntil:
    visible:
      id: record-name
    timeout: 120000
- tapOn:
    id: record-name
- inputText: "Empleado FICTICIO movil"
- tapOn:
    id: sheet-dismiss-keyboard
- scrollUntilVisible:
    element:
      id: record-code
    direction: DOWN
    centerElement: true
- tapOn:
    id: record-code
- inputText: "FICTICIO-MOVIL-01"
- tapOn:
    id: sheet-dismiss-keyboard
- scrollUntilVisible:
    element:
      id: record-rateCents
    direction: DOWN
    centerElement: true
- tapOn:
    id: record-rateCents
- inputText: "2200.00"
- tapOn:
    id: sheet-dismiss-keyboard
- scrollUntilVisible:
    element:
      id: record-note
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: record-note
- inputText: "NOTA-FICTICIA-PERSISTE"
- tapOn:
    id: sheet-dismiss-keyboard
- assertVisible: "^NOTA-FICTICIA-PERSISTE$"
- takeScreenshot: payroll-employee-input
- scrollUntilVisible:
    element:
      id: record-save
    direction: DOWN
    centerElement: true
- tapOn:
    id: record-save
- scrollUntilVisible:
    element: "Editar empleado FICTICIO-MOVIL-01"
    direction: DOWN
    centerElement: true
    timeout: 60000
- takeScreenshot: payroll-employee-saved
