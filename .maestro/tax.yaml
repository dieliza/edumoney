appId: com.edumoney.app
---
- launchApp:
    clearState: true
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: "Quickstep isn't responding"
          commands:
            - tapOn: "Close app"
      - extendedWaitUntil:
          visible: "Abrir Mi dinero"
          timeout: 60000
- tapOn: "Abrir Mi dinero"
- scrollUntilVisible:
    element:
      text: "Añadir ingreso"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    text: "Añadir ingreso"
- scrollUntilVisible:
    element:
      id: movement-amount
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: movement-amount
- eraseText
- inputText: "900.00"
- tapOn:
    text: "Importe recibido o neto.*"
    index: 0
- scrollUntilVisible:
    element:
      id: movement-description
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: movement-description
- eraseText
- inputText: "Salario ficticio"
- tapOn:
    text: "Descripción"
    index: 0
- scrollUntilVisible:
    element:
      id: movement-gross
    direction: DOWN
    centerElement: true
