appId: com.edumoney.app
---
- launchApp:
    clearState: true
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: "Quickstep isn't responding"
          commands:
            - tapOn: "Close app"
      - extendedWaitUntil:
          visible: "Almacenamiento local cifrado preparado."
          timeout: 60000
- takeScreenshot: storage-first-open
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Almacenamiento local cifrado preparado."
    timeout: 30000
- takeScreenshot: storage-reopened
