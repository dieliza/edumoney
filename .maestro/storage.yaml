appId: com.edumoney.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Almacenamiento local cifrado preparado."
    timeout: 60000
- takeScreenshot: storage-first-open
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Almacenamiento local cifrado preparado."
    timeout: 30000
- takeScreenshot: storage-reopened
