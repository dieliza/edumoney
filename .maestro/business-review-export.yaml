- tapOn: Confirmar y compartir expediente JSON
- runFlow:
    when:
      platform: Android
    commands:
    - runFlow:
        when:
          visible: EduMoney QA local
        commands:
        - tapOn: EduMoney QA local
    - extendedWaitUntil:
        visible: '(?s)^JSON comercial local válido: gasto 5500; comercial 2750; dos filas, un movimiento.*'
        timeout: 60000
    - takeScreenshot: commercial-received-json
    - pressKey: BACK
- runFlow:
    when:
      platform: iOS
    commands:
    - extendedWaitUntil:
        visible: .*EduMoney-Negocio-CPA.*
        timeout: 60000
    - takeScreenshot: commercial-share-json
    - tapOn:
        point: 5%,20%
    - assertNotVisible:
        id: ActivityListView
