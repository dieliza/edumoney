appId: com.edumoney.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Abrir Mi dinero"
    timeout: 60000
- tapOn: "Abrir Mi dinero"
- tapOn: "Negocio.*"
- scrollUntilVisible:
    element:
      id: business-legal-name
    direction: DOWN
    centerElement: true
- tapOn:
    id: business-legal-name
- inputText: "Patrono FICTICIO movil"
- tapOn:
    id: form-dismiss-keyboard
- scrollUntilVisible:
    element: "Comerciante individual"
    direction: DOWN
    centerElement: true
- tapOn: "Comerciante individual"
- scrollUntilVisible:
    element:
      id: business-save
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: business-save
- scrollUntilVisible:
    element: "Nómina: Patrono FICTICIO movil"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Nómina: Patrono FICTICIO movil"
- scrollUntilVisible:
    element: "Añadir empleado"
    direction: DOWN
    centerElement: true
- tapOn: "Añadir empleado"
- assertVisible:
    id: record-name
- tapOn:
    id: record-name
- inputText: "Empleado FICTICIO movil"
- tapOn:
    id: sheet-dismiss-keyboard
- scrollUntilVisible:
    element:
      id: record-code
    direction: DOWN
    centerElement: true
- tapOn:
    id: record-code
- inputText: "FICTICIO-MOVIL-01"
- tapOn:
    id: sheet-dismiss-keyboard
- scrollUntilVisible:
    element:
      id: record-rateCents
    direction: DOWN
    centerElement: true
- tapOn:
    id: record-rateCents
- inputText: "2200.00"
- tapOn:
    id: sheet-dismiss-keyboard
- scrollUntilVisible:
    element:
      id: record-note
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: record-note
- inputText: "NOTA-FICTICIA-PERSISTE"
- tapOn:
    id: sheet-dismiss-keyboard
- assertVisible: "^NOTA-FICTICIA-PERSISTE$"
- takeScreenshot: payroll-employee-input
- scrollUntilVisible:
    element:
      id: record-save
    direction: DOWN
    centerElement: true
- tapOn:
    id: record-save
- scrollUntilVisible:
    element: "Editar empleado FICTICIO-MOVIL-01"
    direction: DOWN
    centerElement: true
    timeout: 60000
- takeScreenshot: payroll-employee-saved
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Abrir Mi dinero"
    timeout: 60000
- tapOn: "Abrir Mi dinero"
- tapOn: "Negocio.*"
- scrollUntilVisible:
    element: "Nómina: Patrono FICTICIO movil"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Nómina: Patrono FICTICIO movil"
- scrollUntilVisible:
    element: "Editar empleado FICTICIO-MOVIL-01"
    direction: DOWN
    centerElement: true
- tapOn: "Editar empleado FICTICIO-MOVIL-01"
- assertVisible: "^Empleado FICTICIO movil$"
- scrollUntilVisible:
    element:
      id: record-rateCents
    direction: DOWN
    centerElement: true
- assertVisible: "^2200.00$"
- scrollUntilVisible:
    element:
      id: record-note
    direction: DOWN
    centerElement: true
    timeout: 60000
- assertVisible: "^NOTA-FICTICIA-PERSISTE$"
- takeScreenshot: payroll-employee-reopened
- scrollUntilVisible:
    element:
      id: record-cancel
    direction: DOWN
    centerElement: true
- tapOn:
    id: record-cancel
