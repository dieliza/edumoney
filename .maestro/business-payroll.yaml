appId: com.edumoney.app
---
- runFlow:
    file: business-payroll-setup.yaml
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Abrir Mi dinero"
    timeout: 60000
- tapOn: "Abrir Mi dinero"
- tapOn: "Negocio.*"
- scrollUntilVisible:
    element: "Nómina: Patrono FICTICIO movil"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Nómina: Patrono FICTICIO movil"
- scrollUntilVisible:
    element: "Editar empleado FICTICIO-MOVIL-01"
    direction: DOWN
    centerElement: true
- tapOn: "Editar empleado FICTICIO-MOVIL-01"
- assertVisible: "^Empleado FICTICIO movil$"
- scrollUntilVisible:
    element:
      id: record-rateCents
    direction: DOWN
    centerElement: true
- assertVisible: "^2200.00$"
- scrollUntilVisible:
    element:
      id: record-note
    direction: DOWN
    centerElement: true
    timeout: 60000
- assertVisible: "^NOTA-FICTICIA-PERSISTE$"
- takeScreenshot: payroll-employee-reopened
- scrollUntilVisible:
    element:
      id: record-cancel
    direction: DOWN
    centerElement: true
- tapOn:
    id: record-cancel
