appId: com.edumoney.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Abrir Mi dinero"
    timeout: 60000
- tapOn: "Abrir Mi dinero"
- scrollUntilVisible:
    element:
      id: open-tax
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: open-tax
- extendedWaitUntil:
    visible: "Expediente local para revisión profesional."
    timeout: 60000
- scrollUntilVisible:
    element:
      id: open-planilla
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: open-planilla
- extendedWaitUntil:
    visible: "Entrevista y borrador de cierre para revisión."
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Cálculo automático sin requisito de CPA"
    direction: DOWN
    centerElement: true
    timeout: 60000
- takeScreenshot: stage10-year-pending
- scrollUntilVisible:
    element:
      text: "Notas y situaciones para revisar"
    direction: DOWN
    centerElement: true
    timeout: 120000
- runFlow:
    when:
      platform: iOS
    file: reveal-closure-field.yaml
    env:
      FIELD_ID: closure-notes
- tapOn:
    id: closure-notes
- waitForAnimationToEnd:
    timeout: 3000
# iOS exposes focused=false on UITextView even with its caret/keyboard visible.
# Its proof of input is the exact text assertion before and after keyboard dismissal.
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: closure-notes
          focused: true
- eraseText
- inputText: "Cierre ficticio de prueba"
- assertVisible: "^Cierre ficticio de prueba$"
- tapOn:
    id: form-dismiss-keyboard
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "^Cierre ficticio de prueba$"
- takeScreenshot: stage10-notes-before-save
- scrollUntilVisible:
    element:
      text: "Motivo del cierre o corrección"
    direction: DOWN
    centerElement: true
    timeout: 120000
- runFlow:
    when:
      platform: iOS
    file: reveal-closure-field.yaml
    env:
      FIELD_ID: closure-reason
- tapOn:
    id: closure-reason
- waitForAnimationToEnd:
    timeout: 3000
# iOS exposes focused=false on UITextView even with its caret/keyboard visible.
# Its proof of input is the exact text assertion before and after keyboard dismissal.
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: closure-reason
          focused: true
- eraseText
- inputText: "Prueba ficticia"
- assertVisible: "^Prueba ficticia$"
- tapOn:
    id: form-dismiss-keyboard
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element:
      id: closure-save
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: closure-save
- scrollUntilVisible:
    element:
      text: "Entrevista guardada localmente.*"
    direction: UP
    centerElement: true
    timeout: 60000
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Abrir Mi dinero"
    timeout: 60000
- tapOn:
    text: "Abrir Mi dinero"
- scrollUntilVisible:
    element:
      id: open-tax
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: open-tax
- extendedWaitUntil:
    visible: "Expediente local para revisión profesional."
    timeout: 60000
- scrollUntilVisible:
    element:
      id: open-planilla
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: open-planilla
- extendedWaitUntil:
    visible: "Entrevista y borrador de cierre para revisión."
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Notas y situaciones para revisar"
    direction: DOWN
    centerElement: true
    timeout: 120000
- runFlow:
    when:
      platform: iOS
    file: reveal-closure-field.yaml
    env:
      FIELD_ID: closure-notes
- assertVisible: "^Cierre ficticio de prueba$"
- takeScreenshot: stage10-reopened
