appId: com.edumoney.app
---
- launchApp:
    clearState: true
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: "Quickstep isn't responding"
          commands:
            - tapOn: "Close app"
      - extendedWaitUntil:
          visible: "Abrir Mi dinero"
          timeout: 60000
- tapOn: "Abrir Mi dinero"
- scrollUntilVisible:
    element: '\$0\.00'
    direction: DOWN
    timeout: 60000
- scrollUntilVisible:
    element: "Añadir ingreso"
    direction: DOWN
    timeout: 60000
- tapOn: "Añadir ingreso"
- tapOn:
    id: "movement-amount"
- inputText: "1000.10"
- scrollUntilVisible:
    element:
      id: "movement-description"
    direction: DOWN
    timeout: 60000
- tapOn:
    id: "movement-description"
- inputText: "Salary native test"
- scrollUntilVisible:
    element: "Guardar movimiento"
    direction: DOWN
    timeout: 60000
- tapOn: "Guardar movimiento"
- assertVisible: "Movimiento guardado en este dispositivo."
- scrollUntilVisible:
    element: "Registrar gasto"
    direction: DOWN
    timeout: 60000
- tapOn: "Registrar gasto"
- tapOn:
    id: "movement-amount"
- inputText: "10.20"
- scrollUntilVisible:
    element:
      id: "movement-description"
    direction: DOWN
    timeout: 60000
- tapOn:
    id: "movement-description"
- inputText: "Food native test"
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element: "Comida"
          direction: DOWN
          timeout: 60000
      - tapOn: "Comida"
- scrollUntilVisible:
    element: "Guardar movimiento"
    direction: DOWN
    timeout: 60000
- tapOn: "Guardar movimiento"
- scrollUntilVisible:
    element: '\$989\.90'
    direction: UP
    timeout: 60000
- takeScreenshot: stage3-money-light
- scrollUntilVisible:
    element:
      id: "theme-picker-open"
    direction: UP
    timeout: 60000
- tapOn:
    id: "theme-picker-open"
- tapOn: "Oscuro"
- scrollUntilVisible:
    element: '\$989\.90'
    direction: DOWN
    timeout: 60000
- takeScreenshot: stage3-money-dark
- stopApp
- launchApp
- tapOn: "Abrir Mi dinero"
- assertVisible:
    id: "theme-dark"
- scrollUntilVisible:
    element: '\$989\.90'
    direction: DOWN
    timeout: 60000
- scrollUntilVisible:
    element: "Historial"
    direction: UP
    timeout: 60000
- tapOn: "Historial"
- scrollUntilVisible:
    element: ".*Food native test.*"
    direction: DOWN
    timeout: 60000
- tapOn: ".*Food native test.*"
- tapOn: "Corregir movimiento"
- tapOn:
    id: "movement-amount"
- eraseText: 20
- inputText: "10.10"
- scrollUntilVisible:
    element: "Motivo de la corrección"
    direction: DOWN
    timeout: 60000
- tapOn:
    text: "Motivo de la corrección"
    index: 1
- inputText: "Receipt correction"
- scrollUntilVisible:
    element: "Guardar corrección"
    direction: DOWN
    timeout: 60000
- tapOn: "Guardar corrección"
- assertVisible: ".*Food native test.*"
- takeScreenshot: stage3-history-corrected
- scrollUntilVisible:
    element: "Resumen"
    direction: UP
    timeout: 60000
- tapOn: "Resumen"
- scrollUntilVisible:
    element: '\$990\.00'
    direction: DOWN
    timeout: 60000
- takeScreenshot: stage3-money-corrected

- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element: "Categorías"
          direction: UP
          timeout: 60000
      - tapOn: "Categorías"
      - scrollUntilVisible:
          element: "Definir presupuesto mensual"
          direction: DOWN
          timeout: 60000
      - tapOn: "Definir presupuesto mensual"
      - tapOn:
          text: "Límite mensual (USD)"
          index: 1
      - inputText: "50.00"
      - scrollUntilVisible:
          element: "Guardar presupuesto"
          direction: DOWN
          timeout: 60000
      - tapOn: "Guardar presupuesto"
      - scrollUntilVisible:
          element: '.*\$39\.90 restante.*'
          direction: DOWN
          timeout: 60000
      - takeScreenshot: stage3-budget
      - stopApp
      - launchApp
      - tapOn: "Abrir Mi dinero"
      - tapOn: "Categorías"
      - scrollUntilVisible:
          element: '.*\$39\.90 restante.*'
          direction: DOWN
          timeout: 60000
      - takeScreenshot: stage3-budget-reopened
