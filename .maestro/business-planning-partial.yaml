    direction: DOWN
    centerElement: false
    timeout: 60000
- assertVisible: '^Estimada: confirmar calendario y régimen$'
- takeScreenshot: calendar-regime-pending
- stopApp: null
- launchApp: null
- extendedWaitUntil:
