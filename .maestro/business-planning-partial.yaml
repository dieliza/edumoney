    direction: DOWN
    centerElement: false
    timeout: 60000
- tapOn: ^Comparar escenarios$
- scrollUntilVisible:
    element: ^ESCENARIO-FICTICIO-PARCIAL$
    direction: DOWN
    centerElement: false
    timeout: 60000
- assertVisible: ^ESCENARIO-FICTICIO-PARCIAL$
- scrollUntilVisible:
    element: ^Resultado \$100[.]00 · Cambio \$100[.]00$
    direction: DOWN
    centerElement: false
    timeout: 60000
- assertVisible: ^Resultado \$100[.]00 · Cambio \$100[.]00$
- scrollUntilVisible:
    element: ^VENTA-HIPOTETICA-COBRO-Y-TRIBUTACION-PENDIENTES$
    direction: DOWN
    centerElement: false
    timeout: 60000
- assertVisible: ^VENTA-HIPOTETICA-COBRO-Y-TRIBUTACION-PENDIENTES$
- takeScreenshot: scenario-reopened
- scrollUntilVisible:
    element: ^Resultado y efectivo$
    direction: UP
    centerElement: false
    timeout: 60000
- tapOn: ^Resultado y efectivo$
- scrollUntilVisible:
    element: '^Ganancia / pérdida registrada: \$0[.]00$'
    direction: DOWN
    centerElement: false
    timeout: 60000
- assertVisible: '^Ganancia / pérdida registrada: \$0[.]00$'
- scrollUntilVisible:
    element: '^Efectivo estimado: Pendiente de confirmar$'
