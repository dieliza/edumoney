      id: record-save
    direction: DOWN
    centerElement: false
    timeout: 60000
- tapOn:
    id: record-save
- scrollUntilVisible:
    element: ^ESCENARIO-FICTICIO-PARCIAL$
    direction: DOWN
    centerElement: false
    timeout: 60000
- assertVisible: ^ESCENARIO-FICTICIO-PARCIAL$
- scrollUntilVisible:
    element: ^Resultado \$100[.]00 · Cambio \$100[.]00$
    direction: DOWN
    centerElement: false
    timeout: 60000
- assertVisible: ^Resultado \$100[.]00 · Cambio \$100[.]00$
- takeScreenshot: scenario-saved-partial
- scrollUntilVisible:
