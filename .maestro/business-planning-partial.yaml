    direction: DOWN
    centerElement: false
    timeout: 60000
- assertVisible: ^Efectivo Pendiente de confirmar; cambio Pendiente de confirmar;
    disponible tras reservas Pendiente de confirmar[.]$
- takeScreenshot: scenario-partial-simulation
- scrollUntilVisible:
