appId: com.edumoney.app
---
- launchApp:
    clearState: true
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: "Quickstep isn't responding"
          commands:
            - tapOn: "Close app"
      - extendedWaitUntil:
          visible: "Abrir Mi dinero"
          timeout: 60000
- tapOn: "Abrir Mi dinero"
- scrollUntilVisible:
    element:
      id: "open-bills"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: "open-bills"
- assertVisible: "Mis facturas"
- tapOn:
    id: "add-bill"
- tapOn:
    id: "bill-provider"
- inputText: "Electric test"
- tapOn:
    text: "Proveedor"
    index: 0
- tapOn:
    id: "bill-amount"
- inputText: "100.00"
- tapOn:
    text: "Importe de factura.*"
    index: 0
- scrollUntilVisible:
    element:
      id: "bill-save"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: "bill-save"
- scrollUntilVisible:
    element: "Factura Electric test.*"
    direction: UP
    centerElement: true
    timeout: 60000
- takeScreenshot: stage4-upcoming-light
- tapOn: "Factura Electric test.*"
- tapOn:
    id: "bill-paid"
- tapOn:
    id: "bill-paid-amount"
- eraseText
- inputText: "40.00"
- tapOn:
    text: "Importe pagado.*"
    index: 0
- scrollUntilVisible:
    element:
      id: "bill-confirm-payment"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: "bill-confirm-payment"
- scrollUntilVisible:
    element: "Factura Electric test.*"
    direction: UP
    centerElement: true
    timeout: 60000
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 85%, 75%
          end: 85%, 40%
          duration: 500
- scrollUntilVisible:
    element: '.*Pendiente: \$60\.00'
    direction: DOWN
    centerElement: true
    timeout: 60000
- assertVisible: '.*Pendiente: \$60\.00'
- takeScreenshot: stage4-partial
- tapOn: "Factura Electric test.*"
- tapOn:
    id: "bill-paid"
- scrollUntilVisible:
    element:
      id: "bill-confirm-payment"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: "bill-confirm-payment"
- scrollUntilVisible:
    element: "Pagadas"
    direction: UP
    timeout: 60000
- tapOn: "Pagadas"
- assertVisible: "Factura Electric test.*"
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 85%, 75%
          end: 85%, 40%
          duration: 500
- scrollUntilVisible:
    element: '.*Pendiente: \$0\.00'
    direction: DOWN
    centerElement: true
    timeout: 60000
- takeScreenshot: stage4-paid-light
- tapOn:
    id: "theme-picker-open"
- tapOn: "Oscuro"
- assertVisible:
    id: "theme-dark"
- takeScreenshot: stage4-paid-dark
- tapOn: "Calendario"
- scrollUntilVisible:
    element: "Factura Electric test.*"
    direction: DOWN
    timeout: 60000
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 85%, 75%
          end: 85%, 40%
          duration: 500
- scrollUntilVisible:
    element: '.*Pendiente: \$0\.00'
    direction: DOWN
    centerElement: true
    timeout: 60000
- takeScreenshot: stage4-calendar-dark
- stopApp
- launchApp
- tapOn: "Abrir Mi dinero"
- scrollUntilVisible:
    element: '\$100\.00'
    direction: DOWN
    timeout: 60000
- assertVisible: '.*Gastos registrados.*|Gastos registrados'
- takeScreenshot: stage4-money-after-payments
- scrollUntilVisible:
    element:
      id: "open-bills"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: "open-bills"
- tapOn: "Pagadas"
- assertVisible: "Factura Electric test.*"
- takeScreenshot: stage4-paid-reopened
# Probar un aviso realmente programado en el SO (fecha futura, datos sintéticos).
- tapOn:
    id: "add-bill"
- tapOn:
    id: "bill-provider"
- inputText: "Reminder test"
- tapOn:
    text: "Proveedor"
    index: 0
- tapOn:
    id: "bill-amount"
- inputText: "25.00"
- tapOn:
    text: "Importe de factura.*"
    index: 0
- tapOn:
    id: "bill-due"
- eraseText
- inputText: "2030-01-15"
- tapOn:
    text: "Vencimiento.*"
    index: 0
- scrollUntilVisible:
    element:
      id: "bill-reminder-days"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: "bill-reminder-days"
- inputText: "3"
- tapOn:
    text: "Avisar días antes.*"
    index: 0
- scrollUntilVisible:
    element:
      id: "bill-save"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: "bill-save"
- scrollUntilVisible:
    element: "Activar avisos locales"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Activar avisos locales"
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- scrollUntilVisible:
    element: '1 aviso\(s\) local\(es\).*'
    direction: UP
    timeout: 60000
- takeScreenshot: stage4-local-reminder
- stopApp
- launchApp
- tapOn: "Abrir Mi dinero"
- scrollUntilVisible:
    element:
      id: "open-bills"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: "open-bills"
- scrollUntilVisible:
    element: '1 aviso\(s\) local\(es\).*'
    direction: DOWN
    timeout: 60000
- takeScreenshot: stage4-reminder-reopened
- scrollUntilVisible:
    element: "Factura Reminder test.*"
    direction: UP
    centerElement: true
    timeout: 60000
- tapOn: "Factura Reminder test.*"
- tapOn:
    id: "bill-paid"
- scrollUntilVisible:
    element:
      id: "bill-confirm-payment"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: "bill-confirm-payment"
- scrollUntilVisible:
    element: '0 aviso\(s\) local\(es\).*'
    direction: DOWN
    timeout: 60000
- takeScreenshot: stage4-reminder-cancelled-after-payment
